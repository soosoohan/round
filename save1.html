<style>
    :root {
        --bg-color: #145454;
        --white-color: #F4F6F5;
        --black-color: #1B2B2B;
        --primary-color: #91b2c7;
        --sub-color: #2F4B5C;
        --accent-color: #E8956F;
    }

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Malgun Gothic', sans-serif;
    background: var(--bg-color);
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 750px;
    margin: 0 auto;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.back-button {
    position: absolute;
    top: 10px;
    left: 10px;
    padding: 10px;
    width: 55px;
    height: 55px;
    font-size: 1.8em;
    font-weight: bold;
    background: #145454;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 100;
}

.back-button:hover {
    background: linear-gradient(135deg, #4A628A, #7AB2D3);
    transform: translateY(-2px);
}

.title {
    font-size: 2.0em;
    font-weight: bold;
    color: var(--white-color);
    margin-bottom: 10px;
}

.subtitle {
    color: var(--primary-color);
    font-size: 1.4em;
    font-weight: bold;
    margin-bottom: 5px;
}

.game-desc {
    color: var(--white-color);
    font-size: 1.1em;
}

.game-board {
    background: var(--white-color);
    border-radius: 12px;
    padding: 30px;
    margin-bottom: 20px;
}

.round-section {
    background: var(--primary-color);
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--black-color);
    font-weight: bold;
    font-size: 1.2em;
}

.round-display {
    font-size: 1.3em;
    color: var(--black-color);
    font-weight: bold;
}
 
.score-display {
    font-size: 1.3em;
    color: var(--black-color);
    font-weight: bold;
}

.hint-section {
    background: var(--sub-color);
    color: var(--white-color);
    padding: 15px;
    margin-bottom: 20px;
    text-align: center;
    border-radius: 8px;
}

.hint-text {
    font-size: 1.3em;
    color: var(--white-color);
    font-weight: bold;
}

.sentence-display {
    text-align: center;
    margin-bottom: 20px;
}

.sentence-area {
    font-size: 1.5em;
    font-weight: bold;
    padding: 20px;
    text-align: center;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    word-break: keep-all;
    white-space: normal;
    overflow-wrap: normal;
}
.letter-box {
    display: inline-block;
    min-width: 0.6em;
    height: 1.2em;
    line-height: 1.2em;
    text-align: center;
    margin: 2px;
    white-space: nowrap;
}

.letter-hidden {
    background: var(--primary-color);
    color: var(--primary-color);
}

.letter-shown {
    color: var(--black-color);
}

.space {
    width: 0.5em;
}

.win-message {
    background: rgba(223, 242, 235, 0.9);
    border: 2px solid #7AB2D3;
    color: #4A628A;
    padding: 20px;
    border-radius: 8px;
    font-size: 1.3em;
    font-weight: bold;
    text-align: center;
    margin-bottom: 15px;
}

.next-round-btn {
    background: var(--sub-color);
    color: var(--white-color);
    padding: 15px 30px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.2em;
    font-weight: bold;
    width: 100%;
    transition: all 0.3s ease;
}

.next-round-btn:hover {
    background: #4A628A;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}

.final-message {
    background: var(--accent-color);
    color: var(--white-color);
    padding: 30px;
    border-radius: 12px;
    font-size: 1.5em;
    font-weight: bold;
    text-align: center;
    margin-bottom: 20px;
}

.consonant-section {
    background: var(--white-color);
    border-radius: 12px;
    padding: 30px;
    margin-bottom: 20px;
}

.title-text-desktop {
    display: inline;
}

.title-text-mobile {
    display: none;
}

.consonant-title {
    font-size: 1.2em;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
    color: var(--black-color);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.consonant-input {
    width: 50px;
    height: 40px;
    font-size: clamp(16px, 1.5em, 24px);
    text-align: center;
    border: 2px solid var(--primary-color);
    border-radius: 8px;
    padding: 5px;
    font-family: 'Malgun Gothic', sans-serif;
    background: var(--primary-color);
    color: var(--black-color);
}

.consonant-input:focus {
    outline: none;
    border-color: #4A628A;
}

.consonant-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.consonant-btn {
    width: 100%;
    height: 60px;
    padding: 10px;
    font-size: 1.4em;
    font-weight: bold;
    border: 2px solid var(--primary-color);
    border-radius: 8px;
    cursor: pointer;
    background: var(--primary-color);
    color: var(--black-color);
    transition: all 0.3s ease;
}

.consonant-btn:hover:not(:disabled) {
    background: var(--sub-color);
    color: var(--white-color);
    transform: translateY(-2px);
}

.consonant-btn:disabled {
    cursor: not-allowed;
}

.consonant-btn.correct {
    background: var(--white-color);
    color: var(--primary-color);
    border-color: var(--primary-color);
}

.consonant-btn.wrong {
    background: var(--white-color);
    color: var(--accent-color);
    border-color: var(--accent-color);
}

.game-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-color);
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 15px;
}

.stats {
    font-size: 1.2em;
    font-weight: bold;
    color: var(--white-color);
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.stat-item {
    background: rgba(255, 255, 255, 0.1);
    padding: 10px 15px;
    border-radius: 8px;
}

.stat-correct {
    color: var(--primary-color);
}

.stat-wrong {
    color: var(--accent-color);
}

.new-game-btn {
    background: var(--accent-color);
    color: var(--black-color);
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.1em;
    font-weight: bold;
    transition: all 0.3s ease;
}

.new-game-btn:hover {
    background: linear-gradient(135deg, #4A628A, #7AB2D3);
    transform: translateY(-2px);
}

@media (max-width: 600px) {
    .back-button {
        width: 45px;
        height: 45px;
        font-size: 1.5em;
    }

    .title {
        font-size: 1.8em;
    }

    .sentence-area {
        font-size: 1.3em;
        padding: 15px;
        min-height: 80px;
    }

    .consonant-grid {
        grid-template-columns: repeat(5, 1fr);
    }

    .consonant-btn {
        height: 50px;
        font-size: 1.2em;
    }

    .consonant-title {
        font-size: 1em;
        flex-direction: column;
        gap: 5px;
    }

    .title-text-desktop {
        display: none;
    }
    
    .title-text-mobile {
        display: inline;
    }

    .consonant-input {
        display: none;
    }

    .game-info {
        flex-direction: column;
        align-items: stretch;
    }

    .stats {
        flex-direction: column;
        gap: 10px;
    }

    .new-game-btn {
        width: 100%;
    }
}


</style>
</head>

    const root = document.documentElement;

    root.style.setProperty('--accent-color', theme.accent);

const consonants = ['B','C','D','F','G','H','J','K','L','M','N','P','Q','R','S','T','V','W','X','Y','Z'];
const vowels = ['A','E','I','O','U'];

let currentSentence = '';
let displayArray = [];
let currentRound = 1;
let totalScore = 0;
let roundScore = 10;
let correctCount = 0;
let wrongCount = 0;
let shuffledSentences = [];

function shuffleSentences() {
    shuffledSentences = [...sentences];
    for (let i = shuffledSentences.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledSentences[i], shuffledSentences[j]] = [shuffledSentences[j], shuffledSentences[i]];
    }
}

function startGame() {
    currentRound = 0;
    totalScore = 0;
    shuffleSentences();
    nextRound();
}

function nextRound() {
    // 이전 라운드 점수를 총점에 추가
    if (currentRound > 0) {
        totalScore += roundScore;
    }
    
    // 10라운드 완료 체크
    if (currentRound >= 10) {
        showFinalScore();
        return;
    }
    
    // 새 라운드 시작
    currentRound++;
    roundScore = 10;
    correctCount = 0;
    wrongCount = 0;
    
    // UI 업데이트
    updateStats();
    document.getElementById('roundDisplay').textContent = `문제 ${currentRound}/10`;
    document.getElementById('scoreDisplay').textContent = `점수: ${totalScore}/100`;
    document.getElementById('winMessage').style.display = 'none';
    document.getElementById('finalMessage').style.display = 'none';
    
    // 문장 설정
    const data = shuffledSentences[currentRound - 1];
    currentSentence = data.text.toUpperCase();
    document.getElementById('hintText').textContent = data.hint;
    
    // 게임 표시
    displaySentence();
    createConsonantButtons();
}

function displaySentence() {
    displayArray = [];
    const area = document.getElementById('sentenceArea');
    area.innerHTML = '';
    
    const words = currentSentence.split(' ');
    
    words.forEach((word, wordIndex) => {
        const wordSpan = document.createElement('span');
        wordSpan.style.display = 'inline-block';
        wordSpan.style.whiteSpace = 'nowrap';
        
        for (let char of word) {
            const span = document.createElement('span');
            span.className = 'letter-box';
            
            if (vowels.includes(char) || !char.match(/[a-z]/i)) {
                span.textContent = char;
                span.className = 'letter-box letter-shown';
            } else {
                span.textContent = char;
                span.className = 'letter-box letter-hidden';
                displayArray.push(span);
            }
            
            wordSpan.appendChild(span);
        }
        
        area.appendChild(wordSpan);
        
        if (wordIndex < words.length - 1) {
            const space = document.createElement('span');
            space.className = 'space';
            space.innerHTML = '&nbsp;';
            area.appendChild(space);
        }
    });
}

function createConsonantButtons() {
    const grid = document.getElementById('consonantGrid');
    grid.innerHTML = '';
    
    consonants.forEach(con => {
        const btn = document.createElement('button');
        btn.className = 'consonant-btn';
        btn.textContent = con;
        btn.onclick = () => checkConsonant(con, btn);
        grid.appendChild(btn);
    });
}

function checkConsonant(consonant, btn) {
    btn.disabled = true;
    
    let found = false;
    displayArray.forEach(span => {
        if (span.textContent.toUpperCase() === consonant) {
            span.className = 'letter-box letter-shown';
            found = true;
        }
    });
    
    if (found) {
        // 맞춘 경우
        btn.className = 'consonant-btn correct';
        correctCount++;
    } else {
        // 틀린 경우
        btn.className = 'consonant-btn wrong';
        wrongCount++;
        roundScore = Math.max(0, roundScore - 1);
    }
    
    updateStats();
    checkWin();
}

function updateStats() {
    document.getElementById('correctCount').textContent = correctCount;
    document.getElementById('wrongCount').textContent = wrongCount;
}

function checkWin() {
    const allShown = displayArray.every(span => 
        span.className.includes('letter-shown')
    );
    
    if (allShown) {
        document.getElementById('roundScoreText').textContent = roundScore;
        document.getElementById('winMessage').style.display = 'block';
        disableAllButtons();
    }
}

function disableAllButtons() {
    document.querySelectorAll('.consonant-btn').forEach(btn => {
        btn.disabled = true;
    });
}

function showFinalScore() {
    document.getElementById('finalScore').textContent = totalScore;
    document.getElementById('finalMessage').style.display = 'block';
    document.getElementById('winMessage').style.display = 'none';
    disableAllButtons();
}

function restartGame() {
    currentRound = 0;
    totalScore = 0;
    correctCount = 0;
    wrongCount = 0;
    updateStats();
    shuffleSentences();
    nextRound();
}

// 게임 시작
startGame();
</script>
